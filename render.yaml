services:
  - type: web
    name: ris-data-scrap-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run_api.py
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.11.0